name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  PYTHONUTF8: '1'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon
            arch: mac-arm64
          - os: windows-latest
            arch: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install sounddevice pyinstaller
      - name: Smoke tests (CLI)
        shell: bash
        run: |
          python make_test_pcap.py t.pcap t.pcapng
          python aes67_pcap_to_wav.py t.pcap --list
          python aes67_pcap_to_wav.py t.pcapng --export 1 a.wav
          python aes67_pcap_to_wav.py t.pcap --analyze 2
          python aes67_pcap_to_wav.py t.pcap --export-frames 3 frames --frames 0-1
          python aes67_pcap_to_wav.py t.pcap --export-frames 4 jxsframes --frames 0-1
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name "ST2110 AES67 Stream Viewer" \
            --icon icon.icns --osx-bundle-identifier ch.simplexity.st2110viewer \
            aes67_pcap_to_wav.py
          codesign --force --deep -s - "dist/ST2110 AES67 Stream Viewer.app"
          ditto -c -k --keepParent "dist/ST2110 AES67 Stream Viewer.app" \
            "ST2110-AES67-Stream-Viewer-${{ matrix.arch }}.zip"
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "ST2110 AES67 Stream Viewer" --icon icon.ico aes67_pcap_to_wav.py
          Compress-Archive -Path "dist/ST2110 AES67 Stream Viewer.exe" -DestinationPath "ST2110-AES67-Stream-Viewer-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ST2110-AES67-Stream-Viewer-${{ matrix.arch }}
          path: ST2110-AES67-Stream-Viewer-${{ matrix.arch }}.zip

  build-mac-intel:
    # GitHub retired the free Intel runners (macos-13); build x86_64 on the
    # arm64 runner via Rosetta with the universal2 Python from python.org.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install universal2 Python (python.org)
        run: |
          curl -sLo python.pkg https://www.python.org/ftp/python/3.12.8/python-3.12.8-macos11.pkg
          sudo installer -pkg python.pkg -target /
          arch -x86_64 /usr/local/bin/python3.12 -m pip install --quiet sounddevice pyinstaller
      - name: Smoke tests (CLI, x86_64 via Rosetta)
        run: |
          arch -x86_64 /usr/local/bin/python3.12 make_test_pcap.py t.pcap t.pcapng
          arch -x86_64 /usr/local/bin/python3.12 aes67_pcap_to_wav.py t.pcap --list
          arch -x86_64 /usr/local/bin/python3.12 aes67_pcap_to_wav.py t.pcap --analyze 2
      - name: Build (macOS x86_64)
        run: |
          arch -x86_64 /usr/local/bin/python3.12 -m PyInstaller --noconfirm --windowed \
            --name "ST2110 AES67 Stream Viewer" --icon icon.icns \
            --osx-bundle-identifier ch.simplexity.st2110viewer aes67_pcap_to_wav.py
          codesign --force --deep -s - "dist/ST2110 AES67 Stream Viewer.app"
          ditto -c -k --keepParent "dist/ST2110 AES67 Stream Viewer.app" \
            "ST2110-AES67-Stream-Viewer-mac-x86_64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ST2110-AES67-Stream-Viewer-mac-x86_64
          path: ST2110-AES67-Stream-Viewer-mac-x86_64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-mac-intel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
